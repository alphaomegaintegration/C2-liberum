<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legacy Business Logic Discovery Portal — CEBCS (illustrative)</title>
  <style>
    :root {
      --teal: #1A2B2B;
      --teal-2: #22413c;
      --green: #00A67E;
      --green-d: #00795c;
      --mint: #E8F7F2;
      --mint-2: #d6efe7;
      --ink: #2D3A3A;
      --paper: #ffffff;
      --bg: #eef4f2;
      --rail: #0f2220;
      --line: #d9e7e3;
      --line-2: #c4d8d3;
      --amber: #B8860B;
      --red: #B0413E;
      --muted: #6a7b78;
      --iface: #2f7d8c;
      --slate: #5b6f7a;
      --vp: #6a7b78;
      --vc: #00795c;
      --vpr: #1f6f5c;
      --vch: #B8860B;
      --vr: #B0413E;
      --vb: #7a6353;
      --mono: 'Consolas', 'SF Mono', ui-monospace, Menlo, monospace;
      --sans: 'Calibri', 'Carlito', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
      background: var(--bg);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow: hidden
    }

    a {
      color: var(--green-d);
      text-decoration: none
    }

    a:hover {
      text-decoration: underline
    }

    .muted {
      color: var(--muted)
    }

    .b {
      font-weight: 700
    }

    .mono {
      font-family: var(--mono)
    }

    /* shell */
    header.top {
      height: 52px;
      background: var(--teal);
      color: #eafaf4;
      border-bottom: 3px solid var(--green);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      position: relative;
      z-index: 60
    }

    .brand {
      font-weight: 700;
      letter-spacing: .14em;
      font-size: 13px;
      color: #fff;
      white-space: nowrap
    }

    .brand b {
      color: var(--green)
    }

    .top-title {
      font-size: 13px;
      color: #aecfc6;
      border-left: 1px solid #3a5450;
      padding-left: 14px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .badge {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--teal);
      background: var(--green);
      padding: 4px 9px;
      border-radius: 3px;
      white-space: nowrap
    }

    .hamb {
      display: none;
      background: none;
      border: 1px solid #3a5450;
      color: #cfe7e0;
      border-radius: 6px;
      width: 34px;
      height: 32px;
      font-size: 16px;
      cursor: pointer
    }

    .app {
      display: flex;
      height: calc(100vh - 52px);
      overflow: hidden
    }

    /* rail */
    .rail {
      width: 288px;
      flex: none;
      background: var(--rail);
      color: #cfe1dc;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #06100f
    }

    .rail-search {
      padding: 12px 12px 8px
    }

    .rail-search input {
      width: 100%;
      font-family: var(--sans);
      font-size: 13.5px;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid #21413c;
      background: #0b1b19;
      color: #eafaf4
    }

    .rail-search input::placeholder {
      color: #5f7c76
    }

    .rail-search input:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0, 166, 126, .18)
    }

    .raillist {
      overflow-y: auto;
      flex: 1;
      padding: 4px 8px 24px
    }

    .raillist::-webkit-scrollbar {
      width: 9px
    }

    .raillist::-webkit-scrollbar-thumb {
      background: #21413c;
      border-radius: 5px
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13.5px;
      color: #bcd2cc;
      white-space: nowrap;
      overflow: hidden
    }

    .nav-item:hover {
      background: #15302c;
      color: #eafaf4
    }

    .nav-item.active {
      background: var(--green);
      color: #05231b;
      font-weight: 700
    }

    .nav-item .ni-id {
      font-family: var(--mono);
      font-size: 12px;
      opacity: .9;
      flex: none
    }

    .nav-item .ni-nm {
      overflow: hidden;
      text-overflow: ellipsis
    }

    .nav-item.active .ni-id {
      opacity: 1
    }

    .grp {
      margin-top: 12px
    }

    .grp-h {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      cursor: pointer;
      color: #7fa49c;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      user-select: none
    }

    .grp-h .gcount {
      margin-left: auto;
      background: #15302c;
      color: #9fc4ba;
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 11px;
      letter-spacing: 0
    }

    .grp-h .gcar {
      transition: transform .15s;
      font-size: 10px
    }

    .grp.collapsed .gcar {
      transform: rotate(-90deg)
    }

    .grp.collapsed .grp-body {
      display: none
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex: none
    }

    .sdot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: none;
      border: 1.5px solid rgba(255, 255, 255, .25)
    }

    .statusbar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 4px 10px 8px
    }

    .spill {
      font-size: 10.5px;
      font-weight: 700;
      border-radius: 20px;
      padding: 2px 8px;
      cursor: pointer;
      background: #0b1b19;
      border: 1px solid #21413c;
      color: #9fc4ba
    }

    .spill.on {
      background: var(--green);
      color: #05231b;
      border-color: var(--green)
    }

    .spill .n {
      opacity: .7;
      margin-left: 3px
    }

    .rail-legend {
      font-size: 10.5px;
      color: #6f928b;
      padding: 2px 10px 6px;
      line-height: 1.7
    }

    .rail-legend i {
      font-style: normal
    }

    /* main */
    .main {
      flex: 1;
      overflow-y: auto;
      background: var(--bg)
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 26px 30px 90px
    }

    .crumb {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px
    }

    .crumb a {
      cursor: pointer;
      font-weight: 700;
      color: var(--green-d)
    }

    .crumb .ctype {
      background: #e2ecea;
      color: var(--teal);
      border-radius: 5px;
      padding: 2px 9px;
      font-weight: 700;
      font-size: 12px
    }

    h1.obj {
      font-size: 27px;
      color: var(--teal);
      margin: 2px 0 4px;
      font-weight: 700;
      letter-spacing: -.01em
    }

    .obj-sub {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px
    }

    h2.sec {
      font-size: 21px;
      color: var(--teal);
      margin: 30px 0 6px;
      font-weight: 700
    }

    h3 {
      font-size: 15.5px;
      color: var(--teal);
      margin: 22px 0 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em
    }

    p {
      margin: 0 0 12px
    }

    .lead {
      font-size: 16px;
      color: #43524f;
      max-width: 80ch;
      margin-bottom: 6px
    }

    /* hero / snapshot */
    .hero {
      background: linear-gradient(135deg, var(--teal), var(--teal-2));
      color: #eafaf4;
      border-radius: 12px;
      padding: 26px 28px;
      box-shadow: 0 10px 30px -18px rgba(26, 43, 43, .55)
    }

    .hero .eyebrow {
      color: var(--green);
      font-weight: 700;
      letter-spacing: .16em;
      font-size: 11.5px;
      margin-bottom: 8px
    }

    .hero h1 {
      font-size: 29px;
      line-height: 1.12;
      margin: 0 0 8px;
      font-weight: 700;
      letter-spacing: -.02em
    }

    .hero .sub {
      color: #bcdbd2;
      font-size: 15px;
      max-width: 74ch;
      margin: 0
    }

    .hero .meta {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 20px;
      font-size: 12.5px;
      color: #9fc4ba
    }

    .hero .meta b {
      color: #eafaf4
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 18px
    }

    .tile {
      background: var(--paper);
      padding: 12px 13px
    }

    .tile-v {
      font-size: 19px;
      font-weight: 700;
      color: var(--teal);
      font-family: var(--mono);
      letter-spacing: -.02em
    }

    .tile-k {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.3
    }

    /* callouts */
    .callout {
      border-left: 4px solid var(--green);
      background: var(--mint);
      padding: 13px 16px;
      border-radius: 0 8px 8px 0;
      margin: 14px 0
    }

    .callout.warn {
      border-left-color: var(--amber);
      background: #fbf4e4
    }

    .callout .ct {
      font-weight: 700;
      color: var(--teal);
      margin-bottom: 3px
    }

    .callout.warn .ct {
      color: var(--amber)
    }

    /* cards */
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 6px
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px
    }

    .card.accent {
      border-left: 4px solid var(--green)
    }

    .card .ct {
      font-weight: 700;
      color: var(--teal);
      margin-bottom: 4px
    }

    /* tables */
    .tw {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      margin: 6px 0 4px;
      background: var(--paper)
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13.5px
    }

    th {
      background: var(--teal);
      color: #fff;
      text-align: left;
      padding: 9px 12px;
      font-weight: 700;
      font-size: 12.5px
    }

    td {
      padding: 9px 12px;
      border-top: 1px solid var(--line);
      vertical-align: top
    }

    tbody tr:nth-child(even) {
      background: #fafdfc
    }

    tbody tr.clk {
      cursor: pointer
    }

    tbody tr.clk:hover {
      background: #f1f8f6
    }

    td.step {
      font-family: var(--mono);
      font-weight: 700;
      color: var(--green-d);
      text-align: center;
      width: 30px
    }

    /* chips (universal entity links) */
    .chip {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 9px 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
      line-height: 1.5;
      background: #eef4f2;
      border: 1px solid #dce8e5;
      color: #2d3a3a;
      cursor: pointer;
      margin: 1px 1px;
      vertical-align: baseline
    }

    .chip:hover {
      background: #e4efeb;
      text-decoration: none;
      border-color: var(--line-2)
    }

    .chip::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cdot, #6a7b78);
      display: inline-block;
      margin-right: 6px
    }

    .chip-rule {
      --cdot: var(--green)
    }

    .chip-mod {
      --cdot: #2c6e63
    }

    .chip-data {
      --cdot: var(--slate)
    }

    .chip-iface {
      --cdot: var(--iface)
    }

    .chip-val {
      --cdot: var(--amber)
    }

    .chip-anom {
      --cdot: var(--muted)
    }

    .chip-anom.sv-High {
      --cdot: var(--red)
    }

    .chip-anom.sv-Medium {
      --cdot: var(--amber)
    }

    .chip-anom.sv-Low {
      --cdot: var(--green-d)
    }

    .chip.lg {
      font-size: 13px;
      padding: 3px 12px 3px 10px
    }

    /* confidence + severity pills */
    .pill {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 20px;
      white-space: nowrap
    }

    .cf-Extracted {
      background: #dcf3ec;
      color: var(--green-d)
    }

    .cf-Correlated,
    .cf-Inferred {
      background: #f6ecd2;
      color: #8a6608
    }

    .cf-Blocked {
      background: #f6dedd;
      color: var(--red)
    }

    .sv-pill.High {
      background: #f6dedd;
      color: var(--red)
    }

    .sv-pill.Medium {
      background: #f6ecd2;
      color: #8a6608
    }

    .sv-pill.Low {
      background: #dcf3ec;
      color: var(--green-d)
    }

    .dead-tag {
      background: #f6dedd;
      color: var(--red);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: .04em
    }

    /* field grid */
    .fields {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      margin: 6px 0
    }

    .field {
      display: grid;
      grid-template-columns: 165px 1fr;
      gap: 14px;
      padding: 12px 16px;
      border-top: 1px solid #eef4f2
    }

    .field:first-child {
      border-top: none
    }

    .fk {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .05em;
      text-transform: uppercase;
      padding-top: 2px
    }

    .fv {
      font-size: 14.5px
    }

    .code {
      font-family: var(--mono);
      font-size: 12.5px;
      background: #f4f8f7;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 12px;
      color: #243230;
      white-space: pre-wrap;
      word-break: break-word
    }

    .auth .cav {
      color: var(--muted);
      font-style: italic
    }

    .chiprow {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center
    }

    /* source trace affordance + panel */
    .srcbtn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--teal);
      color: #eafaf4;
      border: none;
      border-radius: 8px;
      padding: 8px 13px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer
    }

    .srcbtn:hover {
      background: var(--teal-2)
    }

    .srctrace {
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--green-d);
      background: #eef6f3;
      border: 1px solid var(--mint-2);
      border-radius: 6px;
      padding: 4px 9px;
      cursor: pointer;
      display: inline-block
    }

    .srctrace:hover {
      background: var(--mint-2)
    }

    #srcback {
      position: fixed;
      inset: 0;
      background: rgba(15, 34, 32, .42);
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s;
      z-index: 70
    }

    #srcback.open {
      opacity: 1;
      visibility: visible
    }

    #srcpanel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 480px;
      max-width: 92vw;
      background: var(--paper);
      box-shadow: -12px 0 40px -18px rgba(0, 0, 0, .4);
      transform: translateX(100%);
      transition: transform .24s ease;
      z-index: 71;
      display: flex;
      flex-direction: column
    }

    #srcpanel.open {
      transform: translateX(0)
    }

    .sp-head {
      background: var(--teal);
      color: #eafaf4;
      padding: 14px 18px;
      display: flex;
      align-items: flex-start;
      gap: 12px
    }

    .sp-head .sp-t {
      flex: 1
    }

    .sp-prog {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 700;
      color: #fff
    }

    .sp-meta {
      font-size: 12px;
      color: #9fc4ba;
      margin-top: 3px;
      font-family: var(--mono)
    }

    .sp-x {
      background: none;
      border: 1px solid #3a5450;
      color: #cfe7e0;
      border-radius: 7px;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-size: 15px;
      flex: none
    }

    .sp-x:hover {
      background: #15302c
    }

    .sp-note {
      font-size: 11.5px;
      color: var(--muted);
      padding: 9px 18px;
      border-bottom: 1px solid var(--line);
      background: #f7fbfa
    }

    .sp-rule {
      padding: 10px 18px;
      border-bottom: 1px solid var(--line)
    }

    .listing {
      flex: 1;
      overflow: auto;
      padding: 8px 0 18px;
      background: #fbfdfd
    }

    .lrow {
      display: flex;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.65;
      padding: 0 12px
    }

    .lrow .lnno {
      width: 46px;
      text-align: right;
      color: #9bb3ae;
      flex: none;
      padding-right: 12px;
      user-select: none
    }

    .lrow .lcode {
      white-space: pre;
      color: #2a3a37
    }

    .lrow.hot {
      background: #eafff5;
      border-left: 3px solid var(--green);
      margin-left: -3px
    }

    .lrow.hot .lcode {
      color: #0a3b2c;
      font-weight: 600
    }

    /* validation workflow */
    .vbox {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      margin: 6px 0
    }

    .vbox .vh {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap
    }

    .vbox .vh .vt {
      font-weight: 700;
      color: var(--teal)
    }

    .vstate-now {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 11px;
      border-radius: 20px;
      color: #fff
    }

    .vbtns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .vbtn {
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px 13px;
      border-radius: 8px;
      cursor: pointer;
      border: 1.5px solid var(--line-2);
      background: #fff;
      color: var(--muted)
    }

    .vbtn:hover {
      border-color: var(--muted);
      color: var(--teal)
    }

    .vbtn.on {
      color: #fff;
      border-color: transparent
    }

    .vbtn[data-s="Pending"].on {
      background: var(--vp)
    }

    .vbtn[data-s="Confirmed"].on {
      background: var(--vc)
    }

    .vbtn[data-s="Preserve"].on {
      background: var(--vpr)
    }

    .vbtn[data-s="Change"].on {
      background: var(--vch)
    }

    .vbtn[data-s="Retire"].on {
      background: var(--vr)
    }

    .vbtn[data-s="Blocked"].on {
      background: var(--vb)
    }

    .vnote {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 9px
    }

    /* figure / diagrams */
    figure {
      margin: 14px 0 6px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px
    }

    .svg-wrap svg {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1000px;
      margin: 0 auto
    }

    figcaption {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 10px;
      text-align: center
    }

    figcaption b {
      color: var(--teal)
    }

    .figtip {
      font-size: 11.5px;
      color: var(--green-d);
      text-align: center;
      margin-top: 4px
    }

    text.svg-hot {
      cursor: pointer;
      text-decoration: underline dotted;
      text-underline-offset: 3px
    }

    text.svg-hot:hover {
      fill: var(--green) !important;
      font-weight: 700
    }

    /* expert console */
    .expert {
      background: var(--paper);
      border: 1px solid var(--line-2);
      border-radius: 12px;
      padding: 20px 22px;

    }

    .expert .eh b {

    }

      font-size: 15px;

      border: 1px solid var(--line-2);

      color: var(--ink);
      background: #fff
    }

    #eq:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0, 166, 126, .14)
    }

    .ebtn {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 14px;
      padding: 0 18px;
      border: none;
      border-radius: 8px;
      background: var(--green);
      color: #06251d;
      cursor: pointer
    }

    .ebtn:hover {
      background: var(--green-d);
      color: #fff
    }

    .ebtn.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line-2)
    }

    .ebtn.ghost:hover {
      color: var(--teal);
      background: #fff
    }

    .examples {
      margin-top: 11px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center
    }

    .examples>span {
      font-size: 12.5px;
      color: var(--muted)
    }

    .ex {
      font-size: 12.5px;
      background: var(--mint);
      color: var(--green-d);
      border: 1px solid var(--mint-2);
      padding: 4px 11px;
      border-radius: 20px;
      cursor: pointer
    }

    .ex:hover {
      background: var(--mint-2)
    }

    #eans {
      margin-top: 16px
    }

    .ans-q {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px
    }

    .ans-body {
      font-size: 15px;
      color: var(--ink);
      background: var(--mint);
      border: 1px solid var(--mint-2);
      border-radius: 8px;
      padding: 13px 16px
    }

    .ans-foot {
      margin-top: 13px
    }

    .ans-foot .gh {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px
    }

    .gcard {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 12px;
      margin-bottom: 7px
    }

    .gcard .gnm {
      font-weight: 700;
      color: var(--teal)
    }

    .gcard .gtr {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted)
    }

    .gcard .gsrc {
      margin-left: auto;
      display: flex;
      gap: 7px;
      align-items: center
    }

    .gsrc-btn {
      font-size: 11.5px;
      font-weight: 700;
      background: var(--teal);
      color: #eafaf4;
      border: none;
      border-radius: 7px;
      padding: 5px 10px;
      cursor: pointer
    }

    .gsrc-btn:hover {
      background: var(--teal-2)
    }

    .vstate-chip {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 20px;
      color: #fff
    }

    .noresult {
      border-left: 4px solid var(--amber);
      background: #fbf4e4;
      border-radius: 0 8px 8px 0;
      padding: 14px 16px;
      font-size: 14.5px
    }

    .noresult b {
      color: var(--amber)
    }

    details.ref {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      overflow: hidden
    }

    details.ref>summary {
      cursor: pointer;
      padding: 13px 16px;
      font-weight: 700;
      color: var(--teal);
      list-style: none
    }

    details.ref>summary::-webkit-details-marker {
      display: none
    }

    details.ref>summary::before {
      content: '▸ ';
      color: var(--green)
    }

    details.ref[open]>summary::before {
      content: '▾ '
    }

    details.ref .refbody {
      padding: 6px 16px 16px
    }

    .stages {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 6px
    }

    .stage {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px;
      background: var(--paper)
    }

    .stage.done {
      border-color: var(--green);
      background: linear-gradient(180deg, var(--mint), #fff)
    }

    .stage-h {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap
    }

    .stage-n {
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: var(--line-2);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      display: grid;
      place-items: center
    }

    .stage.done .stage-n {
      background: var(--green)
    }

    .stage-t {
      font-weight: 700;
      color: var(--teal);
      font-size: 14px
    }

    .stage-tag {
      font-size: 10px;
      font-weight: 700;
      color: #06251d;
      background: var(--green);
      padding: 2px 6px;
      border-radius: 4px
    }

    .stage-o {
      font-size: 12.5px;
      color: #43524f;
      margin-bottom: 6px
    }

    .stage-v {
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 6px
    }

    .foot {
      border-top: 1px solid var(--line);
      margin-top: 40px;
      padding-top: 16px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px
    }

    @media (max-width:980px) {

      .tiles,
      .stages {
        grid-template-columns: repeat(2, 1fr)
      }

      .cards {
        grid-template-columns: 1fr
      }

      .field {
        grid-template-columns: 1fr
      }

      .hamb {
        display: block
      }

      .rail {
        position: fixed;
        top: 52px;
        left: 0;
        height: calc(100vh - 52px);
        z-index: 55;
        transform: translateX(-100%);
        transition: transform .2s
      }

      .rail.open {
        transform: translateX(0)
      }
    }

    /* ============================ v2 portal upgrades ============================ */
    /* export toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 4px;
      align-items: center
    }

    .toolbar .tlabel {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-right: 4px
    }

    .xbtn {
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 700;
      padding: 7px 13px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--line-2);
      background: #fff;
      color: var(--teal);
      display: inline-flex;
      align-items: center;
      gap: 7px
    }

    .xbtn:hover {
      background: var(--mint);
      border-color: var(--green)
    }

    .xbtn.solid {
      background: var(--green);
      color: #06251d;
      border-color: var(--green)
    }

    .xbtn.solid:hover {
      background: var(--green-d);
      color: #fff
    }

    .xbtn .xi {
      font-size: 13px
    }

    /* what-this-demo-proves panel */
    .proves {
      background: linear-gradient(135deg, #12302b, #1d3a35);
      color: #dcefe7;
      border-radius: 12px;
      padding: 18px 22px;
      margin-top: 14px;
      border: 1px solid #224640
    }

    .proves .pt {
      font-weight: 700;
      color: var(--green);
      letter-spacing: .04em;
      font-size: 12.5px;
      text-transform: uppercase;
      margin-bottom: 6px
    }

    .proves p {
      margin: 0;
      font-size: 14.5px;
      color: #cfe7e0;
      max-width: 96ch;
      line-height: 1.55
    }

    /* buyer ribbon */
    .ribbon {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 14px
    }

    .rcard {
      background: var(--paper);
      border: 1px solid var(--line);
      border-top: 3px solid var(--green);
      border-radius: 10px;
      padding: 13px 15px
    }

    .rcard .rwho {
      font-weight: 700;
      color: var(--teal);
      font-size: 13.5px;
      margin-bottom: 3px
    }

    .rcard .rwhat {
      font-size: 12.5px;
      color: #43524f
    }

    /* credibility boundary */
    .boundary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 14px
    }

    .bcard {
      border-radius: 10px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      background: var(--paper)
    }

    .bcard.is {
      border-left: 4px solid var(--green)
    }

    .bcard.isnot {
      border-left: 4px solid var(--amber)
    }

    .bcard.next {
      border-left: 4px solid var(--iface)
    }

    .bcard .bl {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px
    }

    .bcard.is .bl {
      color: var(--green-d)
    }

    .bcard.isnot .bl {
      color: var(--amber)
    }

    .bcard.next .bl {
      color: var(--iface)
    }

    .bcard p {
      margin: 0;
      font-size: 13.5px;
      color: #3a4946
    }

    /* validation progress */
    .progress {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      margin-top: 14px
    }

    .progress .ph {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .progress .ph b {
      color: var(--teal);
      font-size: 16px
    }

    .progress .ph .xbtn {
      margin-left: 0
    }

    .progress .ph .spacer {
      flex: 1
    }

    .pgrid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px
    }

    .pcell {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px 12px;
      text-align: center;
      cursor: pointer
    }

    .pcell:hover {
      background: #f6faf9
    }

    .pcell .pn {
      font-size: 22px;
      font-weight: 700;
      font-family: var(--mono)
    }

    .pcell .pk {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px
    }

    .pcell .pbar {
      height: 4px;
      border-radius: 3px;
      margin-top: 8px;
      background: #e7efec;
      overflow: hidden
    }

    .pcell .pbar i {
      display: block;
      height: 100%;
      border-radius: 3px
    }

    /* richer expert answer */
    .ans-card {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--green);
      border-radius: 0 10px 10px 0;
      background: var(--paper);
      padding: 16px 18px
    }

    .ans-q {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px
    }

    .ans-l {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px
    }

    .ans-sec {
      margin-bottom: 14px
    }

    .ans-body {
      font-size: 15px;
      color: var(--ink);
      background: var(--mint);
      border: 1px solid var(--mint-2);
      border-radius: 8px;
      padding: 13px 16px
    }

    .ans-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px
    }

    .ans-pillrow {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .srctrace-line {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      margin-bottom: 6px
    }

    .ans-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    .ans-known {
      background: #f1f8f6;
      border: 1px solid var(--mint-2);
      border-radius: 8px;
      padding: 12px 14px
    }

    .ans-needs {
      background: #fbf4e4;
      border: 1px solid #efe2c4;
      border-radius: 8px;
      padding: 12px 14px
    }

    .ans-needs .ans-l {
      color: var(--amber)
    }

    .guardrail {
      font-size: 12.5px;
      color: var(--muted);
      background: #f6faf9;
      border: 1px dashed var(--line-2);
      border-radius: 8px;
      padding: 9px 13px;
      margin: 11px 0 0
    }

    .guardrail b {
      color: var(--teal)
    }

    /* rule impact panel */
    .impact {
      margin: 8px 0 4px;
      border: 1px solid var(--line);
      border-radius: 11px;
      overflow: hidden;
      background: var(--paper)
    }

    .impact-h {
      background: var(--teal);
      color: #eafaf4;
      padding: 9px 16px;
      font-weight: 700;
      font-size: 13.5px;
      letter-spacing: .03em;
      display: flex;
      align-items: center;
      gap: 9px
    }

    .impact-h::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green)
    }

    .impact-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1px;
      background: var(--line)
    }

    .icol {
      background: var(--paper);
      padding: 12px 13px
    }

    .icol .il {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px
    }

    .icol .mono {
      font-size: 12px;
      color: #33433f;
      display: block;
      margin-bottom: 8px
    }

    .icol .srcbtn {
      font-size: 11.5px;
      padding: 6px 10px
    }

    .impact-impl {
      padding: 11px 16px;
      border-top: 1px solid var(--line);
      background: #f6faf9;
      font-size: 13.5px;
      color: #33433f
    }

    .impact-impl .il {
      display: inline;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--green-d);
      margin-right: 8px
    }

    /* evidence graph */
    .graphwrap {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 14px 8px
    }

    .graphwrap svg {
      display: block;
      width: 100%;
      height: auto;
      max-width: 960px;
      margin: 0 auto
    }

    .gnode {
      cursor: pointer
    }

    .gnode rect {
      transition: filter .12s
    }

    .gnode:hover rect {
      filter: brightness(.95)
    }

    .gnode:hover .gn-id {
      fill: var(--green-d)
    }

    .glegend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px
    }

    .glegend span {
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .glegend i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block
    }

    /* data lineage flow */
    .lflow {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 14px
    }

    .lstep {
      display: flex;
      align-items: stretch
    }

    .lnode {
      width: 128px;
      min-height: 78px;
      border: 1px solid var(--line-2);
      border-radius: 10px;
      padding: 10px 11px;
      background: #f8fbfa;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: box-shadow .12s, border-color .12s
    }

    .lnode:hover {
      border-color: var(--green);
      box-shadow: 0 6px 16px -12px rgba(26, 43, 43, .5)
    }

    .lnode.terminal {
      background: linear-gradient(180deg, var(--mint), #fff);
      border-color: var(--green)
    }

    .lnode .lt {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--teal);
      line-height: 1.25
    }

    .lnode .lrisks {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px
    }

    .lrisk {
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 700;
      background: #f6dedd;
      color: var(--red);
      border-radius: 5px;
      padding: 1px 6px;
      cursor: pointer
    }

    .lrisk.med {
      background: #f6ecd2;
      color: #8a6608
    }

    .lchev {
      display: flex;
      align-items: center;
      color: var(--green);
      font-size: 20px;
      padding: 0 5px;
      user-select: none
    }

    .lcap {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      text-align: center
    }

    .lcap .chip {
      vertical-align: middle
    }

    /* risk heatmap */
    .heatwrap {
      overflow-x: auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px
    }

    .heat {
      border-collapse: separate;
      border-spacing: 3px;
      min-width: 760px
    }

    .heat th {
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      padding: 4px 6px;
      letter-spacing: .02em;
      position: static;
      text-transform: none
    }

    .heat th.rowh {
      text-align: left;
      color: var(--teal);
      font-size: 12.5px;
      white-space: nowrap;
      padding-right: 10px
    }

    .heat th.cap {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      height: 96px;
      vertical-align: bottom;
      font-weight: 700
    }

    .hcell {
      width: 40px;
      height: 34px;
      border-radius: 6px;
      text-align: center;
      vertical-align: middle;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 13px;
      color: #5a4a2a;
      background: #f4f7f6;
      cursor: default
    }

    .hcell.c0 {
      color: #cdd8d4;
      background: #f6faf9
    }

    .hcell.clk {
      cursor: pointer
    }

    .hcell.clk:hover {
      outline: 2px solid var(--teal);
      outline-offset: -2px
    }

    .heat-legend {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap
    }

    .heat-legend .sw {
      width: 22px;
      height: 14px;
      border-radius: 3px;
      display: inline-block
    }

    /* source drawer extras */
    .sp-meta2 {
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: #fbfdfd
    }

    .spm {
      display: flex;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 6px;
      flex-wrap: wrap
    }

    .spm .spl {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--muted);
      min-width: 118px
    }

    .spm-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0 6px
    }

    .spm-links .xbtn {
      font-size: 11.5px;
      padding: 6px 11px
    }

    .spm-hash {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px
    }

    .pchip {
      cursor: pointer
    }

    /* breadcrumb back affordance */
    .crumb .back {
      margin-left: auto;
      font-size: 12.5px;
      color: var(--green-d);
      cursor: pointer;
      font-weight: 700
    }

    .crumb .back:hover {
      text-decoration: underline
    }

    /* toast */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(20px);
      background: var(--teal);
      color: #eafaf4;
      padding: 11px 18px;
      border-radius: 9px;
      font-size: 13.5px;
      box-shadow: 0 10px 30px -12px rgba(0, 0, 0, .45);
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s, transform .2s;
      z-index: 90;
      border: 1px solid #2c544e
    }

    #toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0)
    }

    @media (max-width:980px) {
      .ribbon {
        grid-template-columns: 1fr 1fr
      }

      .boundary {
        grid-template-columns: 1fr
      }

      .impact-grid {
        grid-template-columns: 1fr 1fr
      }

      .pgrid {
        grid-template-columns: repeat(3, 1fr)
      }

      .ans-grid,
      .ans-split {
        grid-template-columns: 1fr
      }
    }

    /* ============================ v3 clarity polish ============================ */
    /* product / offering label strip */
    .product-label {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 26px;
      margin-top: 14px;
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--green);
      border-radius: 0 10px 10px 0;
      background: var(--paper)
    }

    .product-label span {
      font-size: 13px;
      color: var(--ink)
    }

    .product-label i {
      font-style: normal;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-right: 7px
    }

    /* guided path (compact strip) */
    .guide {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      padding: 14px 16px
    }

    .guide-h {
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 10px
    }

    .guide-steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px
    }

    .gstep {
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    .gnum {
      flex: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--mint-2);
      color: var(--green-d);
      font-weight: 700;
      font-size: 12px;
      display: grid;
      place-items: center;
      margin-top: 1px
    }

    .gtext {
      font-size: 12px;
      color: #43524f;
      line-height: 1.4
    }

    .gtext b {
      display: block;
      color: var(--teal);
      font-size: 13px;
      margin-bottom: 1px
    }

    /* prototype/production mode note */
    .modenote {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px
    }

    .modenote span {
      font-size: 12px;
      color: #43524f;
      background: #f6faf9;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      line-height: 1.45
    }

    .modenote b {
      color: var(--teal)
    }

    /* heatmap executive caption */
    .heat-cap {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 9px;
      max-width: 96ch
    }

    /* source drawer traceability line */
    .spm-trace {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.45;
      border-top: 1px dashed var(--line);
      padding-top: 8px
    }

    @media (max-width:980px) {
      .guide-steps {
        grid-template-columns: 1fr 1fr
      }

      .modenote {
        grid-template-columns: 1fr
      }
    }
  </style>

udit trail", "risk": "High" }, { "id": "IF-008", "name": "Reporting warehouse", "partner": "Agency analytics platform", "dir": "Outbound", "mech": "Monthly extract", "purpose": "Management and compliance reporting", "risk": "Medium" }], "anomalies": [{ "id": "AR-002", "type": "Dead code", "sev": "Low", "loc": "CEBELG01 / 2900-PGM-ROUTE", "module": "CEBELG01", "obs": "The program-type '7' branch is unreachable because an upstream edit constrains PGM-TYPE to 1-5.", "action": "Confirm retired; remove only after SME sign-off." }, { "id": "AR-005", "type": "Rounding conflict", "sev": "Medium", "loc": "CEBCAL02 vs CEBCAL07", "module": "CEBCAL02", "obs": "Official determination rounds half-up; the estimator truncates, allowing a one-cent divergence.", "action": "Reconcile rounding policy across paths." }, { "id": "AR-007", "type": "Hard-coded value", "sev": "High", "loc": "CEBELG04 / 3100-INCOME-TEST", "module": "CEBELG04", "obs": "The income ceiling literal 22884 diverges from the table-driven fiscal-year value.", "action": "Externalize to the threshold table; verify the current limit." }, { "id": "AR-011", "type": "Magic constant", "sev": "Medium", "loc": "CEBCAL03 / line 255", "module": "CEBCAL03", "obs": "An undocumented 0.85 multiplier has no comment and no candidate authority.", "action": "Identify intent; document, externalize, or remove." }, { "id": "AR-014", "type": "Cross-module coupling", "sev": "Medium", "loc": "CEBADJ02 <- CEBCOR05", "module": "CEBADJ02", "obs": "The hardship-waiver flag is set outside the calculation subsystem.", "action": "Document ownership; assess refactor and test impact." }, { "id": "AR-021", "type": "Duplicate logic", "sev": "Medium", "loc": "CEBELG04 / CEBELG06", "module": "CEBELG04", "obs": "Income-test logic is partially duplicated with slight variance.", "action": "Consolidate in the target architecture after SME confirmation." }, { "id": "AR-028", "type": "External dependency", "sev": "High", "loc": "CEBELG07 / PGMX-XREF", "module": "CEBELG07", "obs": "The concurrent-benefit exclusion depends on an external cross-reference file not included in the baseline.", "action": "Validate source, ownership, refresh cadence, and error handling." }, { "id": "AR-034", "type": "Batch sequencing", "sev": "High", "loc": "CEBDLY* JCL", "module": "", "obs": "Eligibility and payment staging depend on daily job order and file availability.", "action": "Model batch orchestration before replacement." }], "vitems": [{ "id": "VAL-001", "item": "Active claim status", "q": "Which status codes currently permit eligibility processing?", "pri": "High", "rule": "BR-EL-0027" }, { "id": "VAL-002", "item": "Income ceiling", "q": "Is the hard-coded value 22884 current, obsolete, or an intentional override?", "pri": "High", "rule": "BR-EL-0014" }, { "id": "VAL-003", "item": "Program-X exclusion", "q": "What is the authoritative source and refresh cadence for Program-X participation?", "pri": "High", "rule": "BR-EX-0033" }, { "id": "VAL-004", "item": "COLA rounding", "q": "Should official determination and the online estimator use the same rounding convention?", "pri": "Medium", "rule": "BR-BC-0058" }, { "id": "VAL-005", "item": "Income offset disregard", "q": "Is the literal 65 the current monthly disregard amount?", "pri": "High", "rule": "BR-BC-0061" }, { "id": "VAL-006", "item": "0.85 multiplier", "q": "What business or policy purpose does the undocumented multiplier serve?", "pri": "High", "rule": "BR-BC-0061" }, { "id": "VAL-007", "item": "Hardship waiver flag", "q": "Which subsystem owns hardship-waiver status and when is it set?", "pri": "Medium", "rule": "BR-AD-0074" }, { "id": "VAL-008", "item": "Obsolete program type", "q": "Is program type 7 retired, or can it arrive through an unmodeled channel?", "pri": "Low", "rule": "BR-EX-0041" }, { "id": "VAL-009", "item": "Zero / negative payment", "q": "Should zero-dollar outcomes generate notices, audit records, or both?", "pri": "Medium", "rule": "BR-BC-0066" }, { "id": "VAL-010", "item": "Audit trail completeness", "q": "Are all required determination and payment events written to audit?", "pri": "High", "rule": "" }], "process": [["1", "Intake validation", "Reject a malformed SSN, invalid dates, missing required fields, and invalid program codes.", "CEBEDT01"], ["2", "Eligibility gates", "Evaluate age/disability, residency, income, resources, and exclusions in sequence.", "CEBELG01"], ["3", "Base benefit lookup", "Select the base benefit rate by program, household type, and fiscal year.", "CEBCAL01"], ["4", "COLA adjustment", "Apply the fiscal-year cost-of-living factor and rounding rule.", "CEBCAL02"], ["5", "Income offset", "Reduce the benefit by the offset formula after the monthly disregard.", "CEBCAL03"], ["6", "Caps and recovery", "Apply min/max caps and overpayment recovery unless a hardship waiver is active.", "CEBCAL04"], ["7", "Payment staging", "Suppress zero/negative payment; stage approved payment; route suspended cases.", "CEBPAY03"], ["8", "Notices and audit", "Generate claimant notices and append an audit event.", "CEBAUD01"]], "experts": [{ "keys": ["income", "countable", "earnings", "wages", "salary", "offset"], "q": "How is countable income used in eligibility and benefit calculation?", "a": "Countable income is tested twice. In eligibility, BR-EL-0014 denies a claim when annualized countable income (WS-CNTBL-INCOME) exceeds the program ceiling; in CEBELG04 that ceiling is loaded from the literal 22884 rather than the threshold table, which is flagged as AR-007. In benefit calculation, BR-BC-0061 reduces the benefit by one dollar for every two dollars of income above the 65 monthly disregard, and an adjacent undocumented 0.85 multiplier (AR-011) is applied with no stated authority.", "cites": ["BR-EL-0014", "BR-BC-0061"], "note": "The hard-coded ceiling, the disregard amount, and the 0.85 multiplier each require SME confirmation (VAL-002, VAL-005, VAL-006) before the behavior is preserved." }, { "keys": ["eligibility", "eligible", "qualify", "qualifies", "gates", "determination", "determine"], "q": "What determines whether a claimant is eligible?", "a": "Eligibility is evaluated as a sequence of gates. A claim must first pass the SSN structural edit (BR-VL-0081) in CEBEDT01, then the age-or-disability gate (BR-EL-0012), residency and status (BR-EL-0027), the countable-income ceiling (BR-EL-0014), the resource limit (BR-EL-0021), and the concurrent-benefit exclusion (BR-EX-0033). A failure at any gate routes to denial staging in CEBELG09.", "cites": ["BR-EL-0012", "BR-EL-0014", "BR-EL-0021", "BR-EL-0027", "BR-EX-0033"], "note": "Income and resource limits depend on the external threshold table (IF-004)." }, { "keys": ["hardship", "waiver", "recovery", "overpayment", "recoup", "recover"], "q": "How does the hardship waiver affect overpayment recovery?", "a": "BR-AD-0074 reduces the net payment to recover an outstanding overpayment balance (OVPMT-BAL) unless the hardship-waiver flag (HARDSHIP-SW) is set. That flag is set outside the calculation chain, in the correspondence subsystem CEBCOR05, which is flagged as cross-subsystem coupling in AR-014.", "cites": ["BR-AD-0074"], "note": "Ownership and timing of the hardship-waiver flag is an open validation item (VAL-007); safe modernization requires understanding both the calculation and correspondence subsystems." }, { "keys": ["program-x", "programx", "program", "concurrent", "dual", "exclusion", "exclude"], "q": "How is the Program-X concurrent-benefit exclusion decided?", "a": "BR-EX-0033 excludes a claimant from concurrent payment when the dual-program indicator (DUAL-PGM-IND) is set. In CEBELG07 that indicator is set by a keyed read against the external cross-reference file PGMX-XREF (interface IF-002); the match population and refresh cadence are outside the analyzed baseline, flagged as AR-028.", "cites": ["BR-EX-0033"], "note": "The authoritative source and refresh cadence for Program-X participation is an open validation item (VAL-003)." }, { "keys": ["rounding", "round", "rounds", "estimate", "estimator", "cents", "discrepancy", "differ", "divergence"], "q": "Why might the online estimate differ from the official determination?", "a": "BR-BC-0058 escalates the base rate by the fiscal-year COLA factor and rounds half-up in CEBCAL02. The online estimator path in CEBCAL07 truncates instead, so the two paths can diverge by up to one cent; this inconsistency is recorded as AR-005.", "cites": ["BR-BC-0058"], "note": "Whether both paths should share one rounding convention is an open validation item (VAL-004)." }, { "keys": ["dead", "obsolete", "unreachable", "retire", "legacy", "branch"], "q": "Is there dead or obsolete code in the eligibility logic?", "a": "BR-EX-0041 routes program-type 7 to a legacy handler, but the branch is unreachable: an upstream edit in CEBELG01 clamps PGM-TYPE to the range 1 through 5 before the branch is reached. This is recorded as dead code in AR-002.", "cites": ["BR-EX-0041"], "note": "Before retiring the branch, confirm that no external channel can set program-type 7 (VAL-008)." }, { "keys": ["ssn", "social", "security", "validation", "edit", "structural"], "q": "How is the Social Security Number validated?", "a": "BR-VL-0081 rejects a claim SSN that fails structural validation in CEBEDT01 — an area of 000, 666, or 900-999, an all-zero group, or an all-zero serial. The edit is a gatekeeper: a failure halts the claim before eligibility processing begins.", "cites": ["BR-VL-0081"], "note": "" }, { "keys": ["cap", "caps", "minimum", "maximum", "floor", "clamp", "payment amount"], "q": "How are minimum and maximum payment amounts enforced?", "a": "BR-BC-0066 clamps the computed benefit to configured minimum and maximum caps in CEBCAL04 after offsets and before payment staging; the result is NET-PAY-AMT.", "cites": ["BR-BC-0066"], "note": "" }], "fallback": "No verified rule in the analyzed baseline matches that question. In production this routes to SME valida     var SKIP_SEL = 'code,.no-lk,.src-listing,.srctrace,.gtr,.sp-meta,.chip,a,svg,.svg-wrap,.graphwrap,.lflow,.heatwrap';

    function entType(tok) {

    function makeChip(tok) {
      var type = entType(tok);

      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      var nodes = [], n;
      while ((n = walker.nextNode())) {
        if (!n.nodeValue || !n.nodeValue.trim()) continue;

    /* evidence graph (radial, centered on a rule) */
    function buildEvidenceGraph(ruleId) {

      (r.interfaces || []).forEach(function (i) { sats.push({ type: 'iface', id: i }); });

    function buildHeatmap() {

        var tds = RISK_COLS.map(function (c) {

        }).join('');

      }).join('');
      var legend = '<div class="heat-legend">Risk intensity:'
        + '<span class="sw" style="background:#fbeede"></span>1'
        + '<span class="sw" style="background:#f3cf9b"></span>2'
        + '<span class="sw" style="background:#e7a07a"></span>3+'
        + '<span style="margin-left:10px">SME-needed:</span>'
        + '<span class="sw" style="background:#dcefe9"></span>1'

        + '<div class="ans-split">'
        + '<div class="ans-known"><div class="ans-l">What is known</div>' + esc(known) + '</div>'
        + '<div class="ans-needs"><div class="ans-l">What requires SME validation</div>' + needs + (relVals.length ? (' <span class="chiprow">' + chipsHTML(relVals, '') + '</span>') : '') + '</div>'
        + '</div></div>';
      linkifyDom(ans);
      Array.prototype.forEach.call(ans.querySelectorAll('.pchip[data-nav]'), function (el) { el.addEventListener('click', function () { var q = el.getAttribute('data-nav').split(':'); nav(q[0], q[1]); }); });
      Array.prototype.forEach.call(ans.querySelectorAll('.gsrc-btn[data-src]'), function (b) { b.addEventListener('click', function () { openSource(b.getAttribute('data-src')); }); });
    }
    function wireExpert(scope) {
      var q = scope.querySelector('#eq'); if (!q) return;
      scope.querySelector('#ego').addEventListener('click', function () { runExpert(q.value); });
      q.addEventListener('keydown', function (e) { if (e.key === 'Enter') runExpert(q.value); if (e.key === 'Escape') { q.value = ''; clearExpert(); } });
      scope.querySelector('#eclear').addEventListener('click', function () { q.value = ''; clearExpert(); });
      Array.prototype.forEach.call(scope.querySelectorAll('.ex'), function (b) {
        b.addEventListener('click', function () { q.value = b.getAttribute('data-q') || b.textContent; runExpert(q.value); });
      });
    }

    /* ----------------------------------------------------- exports ----- */
    function toast(msg) { var t = document.getElementById('toast'); if (!t) return; t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2600); }
    function csv(rows) { return rows.map(function (r) { return r.map(function (c) { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? ('"' + c.replace(/"/g, '""') + '"') : c; }).join(','); }).join('\n'); }
    function dl(name, text, mime) {
      try {
        var b = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
        var u = URL.createObjectURL(b), a = document.createElement('a');
        a.href = u; a.download = name; document.body.appendChild(a); a.click();
        setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(u); }, 120);
        toast('Exported ' + name);
      } catch (e) { toast('Export ready — download blocked in this preview'); }
    }
    function doExport(kind) {
      if (kind === 'reset') { resetDecisions(); return; }
      if (kind === 'rules') {
        var rows = [['Rule ID', 'Name', 'Category', 'Confidence', 'Module', 'Source trace', 'Validation state']];
        DATA.rules.forEach(function (r) { rows.push([r.id, r.name, r.cat, r.conf, r.module, r.src.prog + ' ' + r.src.para + ' ' + r.src.lines, r.vstate]); });
        dl('ao_continuum_code_rules.csv', csv(rows), 'text/csv'); return;
      }
      if (kind === 'workbook') {
        var rows = [['Rule ID', 'Name', 'Category', 'Confidence', 'Source trace', 'Validation state', 'Validation items', 'Anomalies', 'Notes']];
        DATA.rules.forEach(function (r) { rows.push([r.id, r.name, r.cat, r.conf, r.src.prog + ' ' + r.src.para + ' ' + r.src.lines, r.vstate, (r.vitems || []).join(' '), (r.anomalies || []).join(' '), r.notes]); });
        dl('ao_continuum_code_validation_workbook.csv', csv(rows), 'text/csv'); return;
      }
      if (kind === 'risk') {
        var rows = [['Anomaly ID', 'Type', 'Severity', 'Location', 'Subsystem', 'Observation', 'Recommended', 'Related rules']];
        DATA.anomalies.forEach(function (a) { var rr = DATA.rules.filter(function (r) { return r.anomalies.indexOf(a.id) >= 0; }).map(function (r) { return r.id; }).join(' '); rows.push([a.id, a.type, a.sev, a.loc, anomSub(a), a.obs, a.action, rr]); });
        dl('ao_continuum_code_risk_register.csv', csv(rows), 'text/csv'); return;
      }
      if (kind === 'decisions') {
        var rows = [['Rule ID', 'Name', 'Validation state']];
        DATA.rules.forEach(function (r) { rows.push([r.id, r.name, r.vstate]); });
        dl('ao_continuum_code_sme_decisions.csv', csv(rows), 'text/csv'); return;
      }
      if (kind === 'bundle') {
        var bundle = {
          portal: 'CodeIntent Discovery Portal (illustrative)', baseline: DATA.baseline, sourceHash: DATA.sourceHash,
          generated: new Date().toISOString(),
          validationDecisions: DATA.rules.map(function (r) { return { id: r.id, name: r.name, state: r.vstate }; }),
          rules: DATA.rules, modules: DATA.modules, dataElements: DATA.dataels, interfaces: DATA.interfaces,
          anomalies: DATA.anomalies, validationItems: DATA.vitems
        };
        dl('ao_continuum_code_evidence_bundle.json', JSON.stringify(bundle, null, 2), 'application/json'); return;
      }
    }

    /* ----------------------------------------------------- wiring ----- */
    function wireCommon(scope) {
      Array.prototype.forEach.call(scope.querySelectorAll('.srcbtn[data-src],.srctrace[data-src],.gsrc-btn[data-src]'), function (b) {
        b.addEventListener('click', function () { openSource(b.getAttribute('data-src')); });
      });
      Array.prototype.forEach.call(scope.querySelectorAll('.vbtn[data-rule][data-s]'), function (b) {
        b.addEventListener('click', function () { setV(b.getAttribute('data-rule'), b.getAttribute('data-s')); });
      });
      Array.prototype.forEach.call(scope.querySelectorAll('[data-nav]'), function (el) {
        el.addEventListener('click', function (ev) { ev.stopPropagation(); var p = el.getAttribute('data-nav').split(':'); nav(p[0], p[1]); });
      });
      Array.prototype.forEach.call(scope.querySelectorAll('[data-home]'), function (a) {
        a.addEventListener('click', function () { nav('home'); });
      });
      Array.prototype.forEach.call(scope.querySelectorAll('[data-export]'), function (b) {
        b.addEventListener('click', function () { doExport(b.getAttribute('data-export')); });
      });
      Array.prototype.forEach.call(scope.querySelectorAll('.pcell[data-status]'), function (c) {
        c.addEventListener('click', function () { statusFilter = c.getAttribute('data-status'); renderRailList(); if (window.innerWidth <= 980) document.getElementById('rail').classList.add('open'); toast('Rail filtered to "' + c.getAttribute('data-status') + '" rules'); });
      });
    }
    function setMain(html, after) {
      var main = document.getElementById('main');
      main.innerHTML = '<div class="wrap">' + html + '</div>';
      var wrap = main.firstElementChild;
      linkifyDom(wrap); wireCommon(wrap);
      if (after) after(wrap);
      main.scrollTop = 0;
    }
    function afterHome(wrap) { attachSvgNav(wrap); wireExpert(wrap); updateProgress(); }

    /* --------------------------------------------------- explorer ----- */
    function itemLabel(key, o) {
      if (key === 'rule') return { id: o.id, nm: o.name };
      if (key === 'mod') return { id: o.id, nm: o.name };
      if (key === 'data') return { id: o.id, nm: o.def };
      if (key === 'iface') return { id: o.id, nm: o.name };
      if (key === 'anom') return { id: o.id, nm: o.type };
      return { id: o.id, nm: o.item };
    }
    var GROUPS = [
      { key: 'rule', label: 'Rules', items: function () { return DATA.rules; } },
      { key: 'mod', label: 'Modules', items: function () { return DATA.modules; } },
      { key: 'data', label: 'Data elements', items: function () { return DATA.dataels; } },
      { key: 'iface', label: 'Interfaces', items: function () { return DATA.interfaces; } },
      { key: 'anom', label: 'Anomalies', items: function () { return DATA.anomalies; } },
      { key: 'val', label: 'Validation items', items: function () { return DATA.vitems; } }
    ];
    function matchFilter(id, nm) {
      var f = railFilter.toLowerCase();
      return !f || id.toLowerCase().indexOf(f) >= 0 || (nm || '').toLowerCase().indexOf(f) >= 0;
    }
    function ov(type, label) {
      var active = currentKey === type ? ' active' : '';
      return '<div class="nav-item' + active + '" data-key="' + type + '" data-type="' + type + '" data-id=""><span class="dot" style="background:#00A67E"></span><span class="ni-nm">' + label + '</span></div>';
    }
    function renderRailList() {
      var el = document.getElementById('raillist');
      var html = '<div class="grp"><div class="grp-body">'
        + ov('home', 'Overview') + ov('method', 'Methodology &amp; confidence') + ov('next', 'Transformation pathway')
        + '</div></div>';
      GROUPS.forEach(function (g) {
        var list = g.items(), body = '';
        if (g.key === 'rule') {
          var counts = { all: list.length };
          VSTATES.forEach(function (s) { counts[s] = list.filter(function (r) { return r.vstate === s; }).length; });
          var pills = '<span class="spill' + (statusFilter === 'all' ? ' on' : '') + '" data-st="all">All<span class="n">' + counts.all + '</span></span>';
          VSTATES.forEach(function (s) { pills += '<span class="spill' + (statusFilter === s ? ' on' : '') + '" data-st="' + s + '">' + s + '<span class="n">' + counts[s] + '</span></span>'; });
          body += '<div class="statusbar">' + pills + '</div>';
        }
        list.forEach(function (o) {
          var lab = itemLabel(g.key, o);
          if (!matchFilter(lab.id, lab.nm)) return;
          if (g.key === 'rule' && statusFilter !== 'all' && o.vstate !== statusFilter) return;
          var dot = g.key === 'rule'
            ? '<span class="sdot" style="background:' + VCOLOR[o.vstate] + '" title="' + o.vstate + '"></span>'
            : '<span class="dot" style="background:' + DOTCOL[g.key] + '"></span>';
          var active = currentKey === (g.key + ':' + lab.id) ? ' active' : '';
          body += '<div class="nav-item' + active + '" data-key="' + g.key + ':' + lab.id + '" data-type="' + g.key + '" data-id="' + lab.id + '">' + dot + '<span class="ni-id">' + lab.id + '</span><span class="ni-nm">' + esc(lab.nm) + '</span></div>';
        });
        var col = collapsed[g.key] ? ' collapsed' : '';
        html += '<div class="grp' + col + '" data-grp="' + g.key + '">'
          + '<div class="grp-h" data-gtoggle="' + g.key + '"><span class="gcar">▾</span>' + g.label + '<span class="gcount">' + list.length + '</span></div>'
          + '<div class="grp-body">' + (body || '<div class="rail-legend">No matches.</div>') + '</div></div>';
      });
      el.innerHTML = html;
      Array.prototype.forEach.call(el.querySelectorAll('.nav-item[data-key]'), function (it) {
        it.addEventListener('click', function () {
          var t = it.getAttribute('data-type'), i = it.getAttribute('data-id');
          if (t === 'home' || t === 'method' || t === 'next') nav(t); else nav(t, i);
        });
      });
      Array.prototype.forEach.call(el.querySelectorAll('[data-gtoggle]'), function (h) {
        h.addEventListener('click', function () { var k = h.getAttribute('data-gtoggle'); collapsed[k] = !collapsed[k]; renderRailList(); });
      });
      Array.prototype.forEach.call(el.querySelectorAll('.spill[data-st]'), function (s) {
        s.addEventListener('click', function () { statusFilter = s.getAttribute('data-st'); renderRailList(); });
      });
    }

    /* --------------------------------------------------------- nav ----- */
    function closeRailMobile() { if (window.innerWidth <= 980) document.getElementById('rail').classList.remove('open'); }
    function setHash() { try { var h = '#' + currentKey.replace(':', '/'); if (location.hash !== h) history.replaceState(null, '', h); } catch (e) { } }
    function rerender() { if (currentKey.indexOf(':') > 0) { var p = currentKey.split(':'); nav(p[0], p[1]); } else { nav(currentKey); } }
    function nav(type, id) {
      if (type === 'home') { currentKey = 'home'; setMain(renderHome(), afterHome); renderRailList(); closeRailMobile(); setHash(); return; }
      if (type === 'method' || type === 'next') { currentKey = type; setMain(renderStatic(type)); renderRailList(); closeRailMobile(); setHash(); return; }
      var obj = OBJ[type] && OBJ[type][id]; if (!obj) return;
      currentKey = type + ':' + id;
      var fn = ({ rule: renderRule, mod: renderModule, data: renderData, iface: renderIface, anom: renderAnom, val: renderVitem })[type];
      setMain(fn(obj)); renderRailList(); closeRailMobile(); setHash();
    }
    function routeHash() {
      var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
      if (!h) { nav('home'); return; }
      var p = h.split('/');
      if (p.length === 1) { nav(['home', 'method', 'next'].indexOf(p[0]) >= 0 ? p[0] : 'home'); }
      else { if (OBJ[p[0]] && OBJ[p[0]][p[1]]) nav(p[0], p[1]); else nav('home'); }
    }

    /* --------------------------------------------------------- init ----- */
    document.getElementById('railq').addEventListener('input', function (e) { railFilter = e.target.value; renderRailList(); });
    document.getElementById('hamb').addEventListener('click', function () { document.getElementById('rail').classList.toggle('open'); });
    document.getElementById('srcx').addEventListener('click', closeSource);
    document.getElementById('srcback').addEventListener('click', closeSource);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSource(); });
    window.addEventListener('hashchange', function () { var cur = '#' + currentKey.replace(':', '/'); if (location.hash !== cur) routeHash(); });

    renderRailList();
    routeHash();

  </script>
</body>

</html>
